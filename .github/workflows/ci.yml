name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - name: Load public Firebase configuration
        run: cp .env.example .env.production
      - name: Check production Firebase API key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::error::Add the repository Actions secret VITE_FIREBASE_API_KEY."
            exit 1
          fi
      - name: Build web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: npm run build
      - run: npm --prefix functions install
      - run: npm --prefix functions run build
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          project_id: ai-vergadersecretaris
          workload_identity_provider: projects/264157825639/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-deploy@ai-vergadersecretaris.iam.gserviceaccount.com
      - name: Deploy Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx -y firebase-tools@latest deploy --project ai-vergadersecretaris --only auth,firestore,functions,hosting --non-interactive
