name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - name: Load public Firebase configuration
        run: cp .env.example .env.production
      - name: Check production Firebase API key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::error::Add the repository Actions secret VITE_FIREBASE_API_KEY."
            exit 1
          fi
      - name: Build web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: npm run build
      - run: npm --prefix functions install
      - run: npm --prefix functions run build
      - name: Check Firebase deploy credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_VERGADERSECRETARIS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the repository Actions secret FIREBASE_SERVICE_ACCOUNT_AI_VERGADERSECRETARIS."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_VERGADERSECRETARIS }}
      - name: Deploy Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx -y firebase-tools@latest deploy --project ai-vergadersecretaris --only auth,firestore,functions,hosting --non-interactive
